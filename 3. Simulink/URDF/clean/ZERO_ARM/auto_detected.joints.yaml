# Joint config -- this IS the kinematic tree.  Edit parent/child to
# re-wire the chain and 'type' per edge, then re-run:
#   uv run python -m sw2robot.exporter.export <asm> --config this_file.yaml
# type: fixed | revolute | prismatic | continuous
# Sub-assemblies with moving internals expand automatically;
# override with  expand: [name-substr]  /  no_expand: [name-substr]
# Embedded SW2URDF CoordSys/RefAxis config auto-applies when present;
# set sw2urdf_config: off | require  to disable or enforce it, or
#   sw2urdf_config: sw2urdf_compat  to migrate the add-in's OWN output --
#   authored axis signs and its mass/inertia, instead of re-deriving
# A CAD-only part (a dummy axis) can stay in the tree but export as a
# bare frame -- no visual, no collision, no inertial:
#   frame_only: [<part or link name>, ...]   (editor: the row checkbox)
# Named SolidWorks coordinate systems become frame-only links (an
# empty dummy_link on a fixed joint -- no visual/collision/inertial),
# on the part/sub-assembly they were drawn in.  Turn off or pick:
#   coordinate_system_links: off | all | [<CoordSys name>, ...]
# Model only half a symmetric robot and generate the rest -- links,
# joints, inertials and meshes reflected through a base_link plane
# (same q on both sides = mirror pose; limits carry over unchanged):
#   mirror_limbs:
#     - {root: right_arm_0, plane: xz, rename: {right: left}}
# A CAD reference axis can define ONE joint the mates do not show:
#   axis_joints: [{axis: <RefAxis name>, parent: <part>, child: <part>}]
#   (the pair may have no mate at all -- a forgotten constraint)
# Optional per-joint actuator/physics (movable joints only):
#   effort: 5   velocity: 2   dynamics: {damping: 0.1, friction: 0.0}
#   safety_controller: {soft_lower_limit: -1, soft_upper_limit: 1, k_position: 100, k_velocity: 10}   calibration: {rising: 0.0}
